<!DOCTYPE html>

<html>
  <head>
    <title>Printing Services</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div>
      <h1>Upload Document</h1>
      <input type="file" id="uploadDoc" />
      <p id="filename"></p>
    </div>

    <div>
      <h1>Select print options</h1>

      <label for="">Pages</label>
      <input type="number" id="pages" value="1" />

      <label for="">Copies</label>
      <input type="number" id="copies" value="1" />

      <label for="">Type</label>
      <select id="color">
        <option value="bw">BW</option>
        <option value="color">Color</option>
      </select>
    </div>

    <div>
      <h2>Summary</h2>
    </div>

    <form id="form">
      <h2>Form</h2>
      <input type="password" id="name" placeholder="password" />
      <p id="nameError"></p>

      <input type="text" id="password" placeholder="Password" />
      <p id="passwordError"></p>
      <button type="submit">Submit</button>
    </form>

    <p id="status"></p>

    <script src="script.js"></script>


    <ul class="fruit-grid">
      <li>Apple</li>
      <li>Orange</li>
      <li>Banana</li>
      <li>Apple</li>
      <li>Orange</li>
      <li>Banana</li> 
      <li>Apple</li>
      <li>Orange</li>
      <li>Banana</li>                 
    </ul>
  </body>



</html>
